services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant_reports
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tenant_reports"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      DATABASE_URL: postgres://app:app_password@db:5432/tenant_reports
      DB_POOL_MAX: 10
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: